<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>alphashot</title>
  <defs>
    <pattern id="checker" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#f1f3f6"/>
      <rect width="8" height="8" fill="#cfd5de"/>
      <rect x="8" y="8" width="8" height="8" fill="#cfd5de"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.35" stop-color="#fff"/>
      <stop offset="0.95" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="alpha">
      <rect x="14" y="18" width="100" height="88" fill="url(#fade)"/>
    </mask>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b6cf6"/>
      <stop offset="1" stop-color="#2647c9"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="frame">
      <rect x="14" y="18" width="100" height="88" rx="12"/>
    </clipPath>
  </defs>
  <rect x="16" y="24" width="100" height="88" rx="12" fill="#0b1640" opacity="0.35" filter="url(#shadow)"/>
  <g clip-path="url(#frame)">
    <rect x="14" y="18" width="100" height="88" fill="url(#checker)"/>
    <g mask="url(#alpha)">
      <rect x="14" y="18" width="100" height="88" fill="url(#body)"/>
      <rect x="14" y="18" width="100" height="16" fill="#1b2f8f"/>
    </g>
  </g>
  <path d="M86 50C80 72 71 84 58 84C46 84 40 76 40 66C40 55 48 48 57 48C68 48 74 58 79 71C82 79 85 84 92 84"
        fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
